[project]
name = "dino"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7.5",
    "nbformat>=5.10.4",
    "scikit-learn>=1.3.2",
    "setuptools>=75.3.4",
    "timm==0.4.12",
    "torch>=2.4",
    "torchvision>=0.19",
    "wandb>=0.24.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
